onboarding = false
# herdr configuration
# ---------------------------------------------------------------------------
# This is the real config, version-controlled in the dotfiles repo. The
# default location (%APPDATA%\herdr\config.toml on Windows) is a symlink that
# points here, so editing this file edits the live config.
#
# After changing this file, reload the running server with:
#   herdr server reload-config      (or the prefix+shift+r binding below)
# Validate structure/keybindings with:
#   herdr config check
# Print the full annotated default schema with:
#   herdr --default-config
#
# This lives ALONGSIDE the existing psmux setup (psmux.conf,
# powershell/psmux-task.ps1) as a parallel/fallback workflow, not a
# replacement. See tmuxinator/tmux-agents.md for the workflow it mirrors.
# ---------------------------------------------------------------------------

[theme]
# Catppuccin Mocha, always. (Bare "catppuccin" also resolves to Mocha; the
# name is spelled out here to be explicit. auto_switch is intentionally left
# off so it never follows the host terminal into a light theme.)
name = "catppuccin"

auto_switch = false
[keys]
# Prefix key. psmux uses ctrl+a (remapped from tmux's ctrl+b); herdr defaults
# to ctrl+b. Match the psmux muscle memory.
prefix = "ctrl+a"

# --- Tabs (these are the old psmux "windows": agent / editor / lazygit / shell)
#
# The built-in switch_tab action only accepts the indexed 1..9 form. The
# plugin_action bindings below provide tmux-style arbitrary prefix keys.
switch_tab   = "prefix+1..9"
new_tab      = "prefix+c"
next_tab     = "prefix+n"
previous_tab = "prefix+p"
close_tab    = "prefix+shift+x"
rename_tab   = "prefix+shift+t"

# --- Pane focus
# prefix+j/k/l are intentionally reserved for selector plugin bindings below.
focus_pane_left  = "prefix+h"
focus_pane_down  = ""
focus_pane_up    = ""
focus_pane_right = ""
swap_pane_down   = ""
swap_pane_up     = ""
swap_pane_right  = ""

# --- Splits / pane management
split_vertical   = "prefix+v"
split_horizontal = "prefix+minus"
close_pane       = "prefix+x"
zoom             = "prefix+z"
resize_mode      = "prefix+r"

# --- Session / workspace / UI
detach           = "prefix+q"
workspace_picker = "prefix+w"   # interactive space (workspace) picker UI
new_workspace    = "prefix+shift+n"
reload_config    = "prefix+shift+r"
toggle_sidebar   = "prefix+b"   # show/hide the space list in the sidebar

# --- Navigate mode: vim-style j/k to move between workspaces (spaces) in the
# picker/navigate UI (opened by workspace_picker / goto). Defaults are the
# arrow keys; remapped to j/k here. Note: navigate-mode keys must NOT include
# prefix+, esc, enter, tab, or 1..9 -- plain j/k are allowed. Arrow keys still
# work alongside these.
navigate_workspace_up   = "k"   # vim up in the workspace picker
navigate_workspace_down = "j"   # vim down in the workspace picker

[[keys.command]]
key = "prefix+j"
type = "plugin_action"
command = "dotfiles.select.tab-1"
description = "focus tab 1"

[[keys.command]]
key = "prefix+k"
type = "plugin_action"
command = "dotfiles.select.tab-2"
description = "focus tab 2"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "dotfiles.select.tab-3"
description = "focus tab 3"

[[keys.command]]
key = "prefix+semicolon"
type = "plugin_action"
command = "dotfiles.select.tab-4"
description = "focus tab 4"

[[keys.command]]
key = "prefix+shift+j"
type = "plugin_action"
command = "dotfiles.select.workspace-1"
description = "focus workspace 1"

[[keys.command]]
key = "prefix+shift+k"
type = "plugin_action"
command = "dotfiles.select.workspace-2"
description = "focus workspace 2"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "dotfiles.select.workspace-3"
description = "focus workspace 3"

[[keys.command]]
key = "prefix+shift+semicolon"
type = "plugin_action"
command = "dotfiles.select.workspace-4"
description = "focus workspace 4"

[[keys.command]]
key = "prefix+alt+j"
type = "plugin_action"
command = "dotfiles.select.agent-1"
description = "focus agent 1"

[[keys.command]]
key = "prefix+alt+k"
type = "plugin_action"
command = "dotfiles.select.agent-2"
description = "focus agent 2"

[[keys.command]]
key = "prefix+alt+l"
type = "plugin_action"
command = "dotfiles.select.agent-3"
description = "focus agent 3"

[[keys.command]]
key = "prefix+alt+semicolon"
type = "plugin_action"
command = "dotfiles.select.agent-4"
description = "focus agent 4"

# --- Sound -------------------------------------------------------------------
# Headless Linux boxes have no audio device, so every agent state change spammed
# herdr-client.log with "no mp3-capable audio player available". Off globally
# because herdr config has no layering -- scoping to Linux would mean
# duplicating [keys] into a second file. Silences macOS/Windows too.
[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[ui]
show_agent_labels_on_pane_borders = true
