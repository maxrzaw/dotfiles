id = "dotfiles.select"
name = "Select"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Focus Herdr tabs, workspaces, and agents by number from arbitrary keybindings."
platforms = ["linux", "macos"]

[[actions]]
id = "tab-1"
title = "Focus tab 1"
contexts = ["workspace"]
command = ["./target/release/herdr-select", "tab", "1"]

